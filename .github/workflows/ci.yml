name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The generated tree (apis/, internal/controller/) is not committed — every job runs
# `make generate` first. Generation embeds config/schema.json (committed) and compiles
# against the Terraform provider, which go.mod pulls from the public module proxy
# (github.com/groundcover-com/terraform-provider-groundcover) — no checkout, no token.
jobs:
  generate-build-test:
    name: Generate / Vet / Build / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Generate (CRDs + controllers)
        run: make generate

      - name: Go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Generate (lint needs the generated packages present)
        run: make generate

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.9
