name: Release

# Release dry-run, triggered manually or (later, #4) by the Terraform provider's release
# pipeline. For now it only proves a release *would* work: run the live e2e, then build the
# controller image + .xpkg via `make build.all`. Nothing is pushed — publishing to the
# marketplace is a separate, gated step (#7).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp the package with (e.g. v1.16.1). Dry-run default if omitted.'
        required: false
        default: 'v0.0.0-dev'

permissions:
  contents: read

jobs:
  # Reuse the exact e2e flow (kind + out-of-cluster provider + live backend) rather than
  # duplicating it. secrets: inherit passes the testing-environment credentials through.
  e2e:
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  build:
    name: Build image + .xpkg (no push)
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install crossplane CLI
        run: |
          curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh
          sudo mv crossplane /usr/local/bin/

      - name: Build image + .xpkg (no push)
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: make build.all VERSION="$VERSION"

      - name: Upload .xpkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: provider-groundcover-${{ github.event.inputs.version }}.xpkg
          path: _output/*.xpkg
          if-no-files-found: error

  # Push the built .xpkg to the Upbound registry. Private repo by default — this does NOT
  # make it public on the marketplace (that's a separate `up repository update --publish`
  # step). Skipped for dry-runs so junk versions never reach the public namespace.
  publish-upbound:
    name: Push .xpkg to Upbound
    needs: build
    if: github.event.inputs.version != 'v0.0.0-dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: provider-groundcover-${{ github.event.inputs.version }}.xpkg

      # Official action: installs up and logs in. Pinned by commit SHA (like the goreleaser/
      # GPG actions in terraform-provider-groundcover) so the toolchain is trusted without
      # pinning the up version itself — version defaults to `current`.
      - name: Set up + log in to Upbound
        uses: upbound/action-up@2c4d9663b902087b0808b79fe2c7ec68424d87d8 # v1.2.0
        with:
          api-token: ${{ secrets.UP_TOKEN }}

      # version is passed via env (not interpolated into the shell) and validated against the
      # tag format before use, so workflow input can't be treated as shell code.
      - name: Push to Upbound
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid version: $VERSION"; exit 1; }
          up xpkg push \
            "xpkg.upbound.io/groundcover-com/provider-groundcover:${VERSION}" \
            -f "provider-groundcover-${VERSION}.xpkg"
