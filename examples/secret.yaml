# A groundcover secret (secrets.groundcover.com, not a core Kubernetes Secret). The value is
# read once from the referenced Kubernetes Secret and stored in the groundcover secret store;
# it is write-only and never returned by the API. Once SYNCED, status.atProvider.id is the id
# to use inside a DataIntegration config as "secretRef::store::<id>".
apiVersion: secrets.groundcover.com/v1alpha1
kind: Secret
metadata:
  name: postgres-password
spec:
  providerConfigRef:
    name: default
  forProvider:
    name: postgres-password
    type: password # api_key | password | basic_auth
    contentSecretRef:
      namespace: crossplane-system
      name: postgres-credentials
      key: password
