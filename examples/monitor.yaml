# A groundcover monitor — typed (backed by groundcover_monitor_v2). The legacy YAML-blob
# monitor (groundcover_monitor) is no longer exposed; configure monitors with typed fields.
apiVersion: monitoring.groundcover.com/v1alpha1
kind: Monitor
metadata:
  name: gcql-logs-error-count
spec:
  providerConfigRef:
    name: default
  forProvider:
    title: GCQL Logs Error Count
    severity: critical
    measurementType: event
    display:
      header: GCQL Logs Error Count
      description: Fires when error logs are observed in the evaluation window.
      contextHeaderLabels:
        - cluster
        - namespace
        - workload
    query:
      type: gcql
      dataType: logs
      expression: "level:error | stats count() count_all_result"
      instantRollup: 5m
    threshold:
      - name: threshold_1
        inputName: threshold_input_query
        operator: gt
        values:
          - 10
    evaluationInterval:
      interval: 1m
      pendingFor: 5m
    notificationSettings:
      method: connectedApps
      connectedApps:
        - slack-connected-app-id
      # Per-connected-app delivery options, keyed by connected app ID, as a JSON string
      # (upjet cannot model the nested map, so it is passed as JSON). Each entry takes
      # `channels` ([{id (required), name}]) plus optional Linear fields: team_id,
      # assignee_id, delegate_id, project_id, resolved_status_id, label_ids ([]string),
      # and auto_resolve (bool).
      connectedAppParams: |
        {
          "slack-connected-app-id": {
            "channels": [{ "id": "C0123456789", "name": "#alerts" }],
            "team_id": "linear-team-id",
            "assignee_id": "linear-user-id",
            "label_ids": ["linear-label-id"],
            "auto_resolve": true
          }
        }
      statusFilters:
        - Alerting
        - Resolved
      renotificationInterval: 4h
      disableRenotification: false
    executionErrorState: OK
    noDataState: OK
